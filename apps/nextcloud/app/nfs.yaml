apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-nextcloud
spec:
  storageClassName: nextcloud-storageclass
  capacity:
    storage: 18T
  accessModes:
    - ReadWriteMany
  mountOptions:
    - local_lock=posix
    - nfsvers=4.1
  nfs:
    server: "${NFS_SERVER}"
    path: "${NFS_KUBERNETES}/nextcloud"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-nextcloud
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nextcloud-storageclass
  resources:
    requests:
      storage: 1T
---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-pod
spec:
  containers:
    - name: web-server
      image: nginx
      volumeMounts:
        - name: nfs-storage
          mountPath: /usr/share/nginx/html # Where the NFS data appears in the pod
  volumes:
    - name: nfs-storage
      persistentVolumeClaim:
        claimName: nfs-nextcloud # Must match the metadata.name of the PVC above
---
