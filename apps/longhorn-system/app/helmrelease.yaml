---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app longhorn
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: ${MY_NAMESPACE}
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    global:
      imageRegistry: docker.io
    openshift:
      enabled: true
      ui:
        route: "longhorn-ui"
        port: 443
        proxy: 8443
    image:
      openshift:
        oauthProxy:
          repository: quay.io/openshift/origin-oauth-proxy
          tag: 4.17
      defaultBackupStore:
        backupTarget: cifs://nas.home.angelnu.com/NetBackup/longhorn/${CLUSTER_NAME}
        backupTargetCredentialSecret: cifs-secret
