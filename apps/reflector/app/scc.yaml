---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reflector-scc-default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: reflector
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:nonroot
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reflector-scc-reflector
subjects:
  - kind: ServiceAccount
    name: ${MY_NAMESPACE}
    namespace: reflector
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:nonroot
  apiGroup: rbac.authorization.k8s.io