---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reflector-scc-default
  namespace: reflector
subjects:
  - kind: ServiceAccount
    name: default
    namespace: reflector
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:privileged
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reflector-scc-reflector
  namespace: reflector
subjects:
  - kind: ServiceAccount
    name: reflector
    namespace: reflector
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:privileged
  apiGroup: rbac.authorization.k8s.io