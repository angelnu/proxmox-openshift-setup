---
apiVersion: v1
kind: Secret
metadata:
  name: nas-s3-creds
stringData:
  ACCESS_KEY_ID: "${S3_NAS_USERNAME}"
  ACCESS_SECRET_KEY: "${S3_NAS_PASSWORD}"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: test
spec:
  instances: 3 # 1 Primary + 2 Replicas for High Availability
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1

  # High Availability Settings
  minSyncReplicas: 1 # Ensures at least one replica is always in sync (no data loss)
  maxSyncReplicas: 1

  # 1. Continuous Backup to Synology (MinIO)
  backup:
    barmanObjectStore:
      destinationPath: s3://${S3_NAS_POSTGRES_BUCKET}/
      endpointURL: "${S3_NAS_URL}"
      s3Credentials:
        accessKeyId:
          name: nas-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: nas-s3-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip # Compresses logs before sending to NAS
    retentionPolicy: "30d" # Automatically clean up old backups on the NAS

  # 2. Resource Management (Guaranteed QoS)
  # Keeping requests and limits identical prevents OOM kills
  resources:
    requests:
      memory: "128Mi"
      cpu: "10m"
    limits:
      memory: "1Gi"
      cpu: "1"

  # 3. Storage Configuration
  storage:
    size: 2Gi
  walStorage:
    # Separate WAL storage is recommended for production to avoid IO contention
    size: 1Gi

  # 4. Database Initialization
  bootstrap:
    initdb:
      database: app_db
      owner: app_user
      # secret:
      #   name: app-user-credentials

  # 5. Monitoring
  monitoring:
    enablePodMonitor: true # Auto-generates metrics for Prometheus/Grafana
