---

# This example uses YAML anchors which allows reuse of multiple keys 
# without having to repeat yourself.
# Also see https://github.com/Mic92/dotfiles/blob/master/nixos/.sops.yaml
# for a more complex example.
keys:
  age:
  - &cluster_age_key age15gheadx06yqv700xe3g3ra9x85fn9xqu9chqt6fhh2caevpcgsrqlg6tlx
  - &angel_age_key age19zycawkart4t4l7a238w0n2w0rmw6anjadwv9yr3ce3js4dz3dcqqgkvsw
creation_rules:
  - path_regex: .+secret(\.sops)?\.ya?ml
    input_type: yaml
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age: &key_groups
          - *cluster_age_key
          - *angel_age_key
  - path_regex: .+secret(\.sops)?\.env
    input_type: env
    key_groups:
      - age: *key_groups
stores:
  yaml:
    indent: 2

